<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- PWA 設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f8ef7">

  <!-- iOS PWA 設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="News Brief">
  <link rel="apple-touch-icon" href="icon.svg">

  <title>Daily News Brief</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3347;
      --text: #e8eaf0;
      --text-sub: #8b90a7;
      --accent: #4f8ef7;
      --high: #f75f5f;
      --mid: #f7a94f;
      --low: #4fcf8e;
      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Helvetica Neue', 'Hiragino Kaku Gothic ProN', sans-serif;
      min-height: 100vh;
      padding-bottom: calc(80px + var(--safe-bottom));
    }

    /* ヘッダー */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 17, 23, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: calc(14px + var(--safe-top)) 16px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--accent);
    }

    .header-left .date {
      font-size: 11px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .score-badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 12px;
      color: var(--text-sub);
      cursor: pointer;
    }

    /* トピックフィルター */
    .topic-bar {
      padding: 10px 16px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .topic-bar::-webkit-scrollbar { display: none; }

    .topic-chip {
      flex-shrink: 0;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-sub);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }

    .topic-chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* 統計バー */
    .stats-bar {
      padding: 8px 16px;
      display: flex;
      gap: 16px;
      border-bottom: 1px solid var(--border);
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--text-sub);
    }

    .stat-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    /* ニュースカード */
    .news-list {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .news-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .card-header {
      padding: 12px 12px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-header-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .importance-badge {
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }

    .importance-badge.high { background: rgba(247,95,95,0.15); color: var(--high); }
    .importance-badge.mid  { background: rgba(247,169,79,0.15); color: var(--mid); }
    .importance-badge.low  { background: rgba(79,207,142,0.15); color: var(--low); }

    .topic-badge {
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      background: rgba(79,142,247,0.15);
      color: var(--accent);
    }

    .source-label {
      font-size: 11px;
      color: var(--text-sub);
    }

    .card-title {
      padding: 0 12px 8px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.5;
    }

    .card-summary {
      padding: 0 12px 8px;
      font-size: 13px;
      line-height: 1.7;
      color: var(--text-sub);
    }

    .card-keywords {
      padding: 0 12px 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .keyword {
      padding: 3px 7px;
      background: var(--surface2);
      border-radius: 5px;
      font-size: 11px;
      color: var(--text-sub);
    }

    .card-footer {
      border-top: 1px solid var(--border);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .feedback-buttons {
      display: flex;
      gap: 8px;
    }

    .feedback-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-sub);
      font-size: 14px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.15s;
    }

    .feedback-btn .count { font-size: 12px; }

    .feedback-btn.up.active  { background: rgba(79,207,142,0.15); border-color: var(--low); color: var(--low); }
    .feedback-btn.down.active { background: rgba(247,95,95,0.15); border-color: var(--high); color: var(--high); }

    .card-url {
      font-size: 11px;
      color: var(--accent);
      text-decoration: none;
    }

    /* ローディング */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      gap: 16px;
      color: var(--text-sub);
      font-size: 14px;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* フィードバックパネル */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 150;
    }

    .overlay.open { display: block; }

    .feedback-panel {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      padding: 20px 16px calc(40px + var(--safe-bottom));
      z-index: 200;
      max-height: 70vh;
      overflow-y: auto;
    }

    .feedback-panel.open {
      display: block;
      animation: slideUp 0.25s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .panel-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 16px;
      text-align: center;
    }

    .feedback-summary { display: flex; flex-direction: column; gap: 8px; }

    .feedback-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: var(--surface2);
      border-radius: 8px;
      font-size: 13px;
    }

    .feedback-row .title-short {
      flex: 1;
      margin-right: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }

    .panel-close {
      margin-top: 14px;
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-sub);
      font-size: 14px;
      line-height: 2;
    }

    /* トピックカラー */
    .topic-security  { background: rgba(247,95,95,0.12); color: #f78f8f; }
    .topic-automotive { background: rgba(247,169,79,0.12); color: #f7c04f; }
    .topic-ai        { background: rgba(79,142,247,0.12); color: var(--accent); }
    .topic-cloud     { background: rgba(79,207,142,0.12); color: var(--low); }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>📰 Daily News Brief</h1>
    <div class="date" id="header-date">読み込み中...</div>
  </div>
  <div class="score-badge" onclick="openFeedbackPanel()">📊 評価履歴</div>
</header>

<div class="topic-bar" id="topic-bar">
  <div class="topic-chip active" onclick="filterTopic('all', this)">すべて</div>
  <div class="topic-chip" onclick="filterTopic('security', this)">🔒 セキュリティ</div>
  <div class="topic-chip" onclick="filterTopic('automotive', this)">🚗 自動車</div>
  <div class="topic-chip" onclick="filterTopic('ai', this)">🤖 AI</div>
  <div class="topic-chip" onclick="filterTopic('cloud', this)">☁️ クラウド</div>
</div>

<div class="stats-bar">
  <div class="stat-item">
    <div class="stat-dot" style="background:var(--high)"></div>
    <span id="stat-high">高: 0</span>
  </div>
  <div class="stat-item">
    <div class="stat-dot" style="background:var(--mid)"></div>
    <span id="stat-mid">中: 0</span>
  </div>
  <div class="stat-item">
    <div class="stat-dot" style="background:var(--low)"></div>
    <span id="stat-low">低: 0</span>
  </div>
  <div class="stat-item" style="margin-left:auto">
    <span id="stat-total" style="color:var(--accent)">0件</span>
  </div>
</div>

<div class="news-list" id="news-list">
  <div class="loading">
    <div class="spinner"></div>
    <span>ニュースを読み込み中...</span>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeFeedbackPanel()"></div>
<div class="feedback-panel" id="feedback-panel">
  <div class="panel-title">📊 評価履歴</div>
  <div class="feedback-summary" id="feedback-summary"></div>
  <button class="panel-close" onclick="closeFeedbackPanel()">閉じる</button>
</div>

<script>
  const STORAGE_KEY = 'news_feedback_v2';
  let allArticles = [];

  const TOPIC_LABELS = {
    security: '🔒 セキュリティ',
    automotive: '🚗 自動車',
    ai: '🤖 AI',
    cloud: '☁️ クラウド'
  };

  function getFeedback() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
    catch { return {}; }
  }

  function saveFeedback(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function getToday() {
    return new Date().toISOString().split('T')[0];
  }

  async function loadNews() {
    const today = getToday();
    for (const url of [`data/news-${today}.json`, `data/latest.json`]) {
      try {
        const res = await fetch(url);
        if (res.ok) { renderNews(await res.json()); return; }
      } catch {}
    }
    document.getElementById('news-list').innerHTML =
      '<div class="empty">今日のニュースはまだ取得されていません。<br>毎朝8時に自動更新されます。</div>';
    document.getElementById('header-date').textContent = today;
  }

  function renderNews(data) {
    allArticles = data.articles || [];
    const date = data.date || getToday();
    document.getElementById('header-date').textContent =
      new Date(date).toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric' });
    renderCards(allArticles);
  }

  function renderCards(articles) {
    const feedback = getFeedback();

    const high = articles.filter(a => a.importance === '高').length;
    const mid  = articles.filter(a => a.importance === '中').length;
    const low  = articles.filter(a => a.importance === '低').length;
    document.getElementById('stat-high').textContent = `高: ${high}`;
    document.getElementById('stat-mid').textContent  = `中: ${mid}`;
    document.getElementById('stat-low').textContent  = `低: ${low}`;
    document.getElementById('stat-total').textContent = `${articles.length}件`;

    if (!articles.length) {
      document.getElementById('news-list').innerHTML =
        '<div class="empty">該当する記事がありません</div>';
      return;
    }

    document.getElementById('news-list').innerHTML = articles.map((a, i) => {
      const id = a.id || `a-${i}`;
      const fb = feedback[id];
      const ic = a.importance === '高' ? 'high' : a.importance === '中' ? 'mid' : 'low';
      const topicClass = `topic-${a.topic || 'ai'}`;
      const topicLabel = TOPIC_LABELS[a.topic] || a.topic || '';
      const keywords = (a.keywords || []).map(k => `<span class="keyword">${k}</span>`).join('');

      return `
        <div class="news-card">
          <div class="card-header">
            <div class="card-header-left">
              <span class="importance-badge ${ic}">${a.importance || '中'}</span>
              <span class="topic-badge ${topicClass}">${topicLabel}</span>
            </div>
            <span class="source-label">${a.source || ''}</span>
          </div>
          <div class="card-title">${a.title || ''}</div>
          <div class="card-summary">${a.summary || ''}</div>
          <div class="card-keywords">${keywords}</div>
          <div class="card-footer">
            <div class="feedback-buttons">
              <button class="feedback-btn up ${fb === 'up' ? 'active' : ''}"
                onclick="setFeedback('${id}', 'up', this, event)">
                👍 <span class="count">${a.upCount || 0}</span>
              </button>
              <button class="feedback-btn down ${fb === 'down' ? 'active' : ''}"
                onclick="setFeedback('${id}', 'down', this, event)">
                👎 <span class="count">${a.downCount || 0}</span>
              </button>
            </div>
            ${a.url ? `<a href="${a.url}" target="_blank" class="card-url">元記事 →</a>` : ''}
          </div>
        </div>`;
    }).join('');
  }

  function setFeedback(id, type, btn, e) {
    e.stopPropagation();
    const fb = getFeedback();
    if (fb[id] === type) { delete fb[id]; }
    else { fb[id] = type; }
    saveFeedback(fb);
    const card = btn.closest('.news-card');
    card.querySelector('.feedback-btn.up').classList.toggle('active', fb[id] === 'up');
    card.querySelector('.feedback-btn.down').classList.toggle('active', fb[id] === 'down');
  }

  function filterTopic(topic, chip) {
    document.querySelectorAll('.topic-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    renderCards(topic === 'all' ? allArticles : allArticles.filter(a => a.topic === topic));
  }

  function openFeedbackPanel() {
    const fb = getFeedback();
    const rated = allArticles.filter((a, i) => fb[a.id || `a-${i}`]);
    document.getElementById('feedback-summary').innerHTML = rated.length
      ? rated.map((a, i) => {
          const id = a.id || `a-${i}`;
          return `<div class="feedback-row">
            <span class="title-short">${a.title || '無題'}</span>
            <span>${fb[id] === 'up' ? '👍' : '👎'}</span>
          </div>`;
        }).join('')
      : '<div class="feedback-row"><span class="title-short">まだ評価がありません</span></div>';
    document.getElementById('overlay').classList.add('open');
    document.getElementById('feedback-panel').classList.add('open');
  }

  function closeFeedbackPanel() {
    document.getElementById('overlay').classList.remove('open');
    document.getElementById('feedback-panel').classList.remove('open');
  }

  loadNews();
</script>
</body>
</html>
