name: Claude API News Processing

# トリガー設定：手動実行のみ
on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'ニューストピック（例：security, automotive, ai）'
        required: true
        default: 'security'
      max_results:
        description: '取得するニュース件数'
        required: false
        default: '5'

jobs:
  process-news:
    runs-on: ubuntu-latest
    
    steps:
      # ステップ 1: リポジトリのチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # ステップ 2: Node.js 環境のセットアップ
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ステップ 3: 依存パッケージのインストール
      - name: Install dependencies
        run: npm install @anthropic-ai/sdk

      # ステップ 4: ニュース取得スクリプトの実行
      - name: Fetch news articles
        id: fetch_news
        run: node scripts/fetch-news.js ${{ github.event.inputs.topic }} ${{ github.event.inputs.max_results }}
        env:
          # 環境変数としてシークレットを渡す（ログには出力されない）
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}

      # ステップ 5: Claude APIでニュース処理
      - name: Process with Claude API
        id: claude_process
        run: node scripts/process-with-claude.js
        env:
          # ここでシークレットを使用
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          # ステップ 4 の出力を受け取る
          FETCHED_NEWS_FILE: ./output/raw-news.json

      # ステップ 6: 処理結果をファイルに保存
      - name: Save results
        run: |
          mkdir -p output
          echo "${{ steps.claude_process.outputs.summary }}" > output/news-summary.md
          cat output/news-summary.md

      # ステップ 7: 変更をコミット＆プッシュ
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add output/news-summary.md
          git commit -m "Update news summary - $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push

      # ステップ 8: 実行結果をワークフロー履歴に記録（デバッグ用）
      - name: Summary
        if: always()
        run: |
          echo "## ✅ ワークフロー実行完了" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**実行時刻:** $(date +'%Y-%m-%d %H:%M:%S JST')" >> $GITHUB_STEP_SUMMARY
          echo "**トピック:** ${{ github.event.inputs.topic }}" >> $GITHUB_STEP_SUMMARY
          echo "**結果ファイル:** [output/news-summary.md](output/news-summary.md)" >> $GITHUB_STEP_SUMMARY