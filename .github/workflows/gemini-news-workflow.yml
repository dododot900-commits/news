name: Gemini News Workflow

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic (all)'
        required: false
        default: 'all'

permissions:
  contents: write

jobs:
  process-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch security news
        run: node scripts/fetch-news.js security 10

      - name: Fetch vendor news
        run: node scripts/fetch-news.js vendor 10

      - name: Fetch AI news
        run: node scripts/fetch-news.js ai 10

      - name: Fetch cloud news
        run: node scripts/fetch-news.js cloud 10

      - name: Fetch network news
        run: node scripts/fetch-news.js network 10

      - name: Fetch enterprise news
        run: node scripts/fetch-news.js enterprise 10

      - name: Process all topics with Gemini API
        run: node scripts/process-with-gemini.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/data/ output/ || true
          git commit -m "Update news - $(date +'%Y-%m-%d')" || echo "No changes"
          git push

      - name: Summary
        if: always()
        run: |
          echo "## Gemini News Workflow" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date +'%Y-%m-%d %H:%M JST')" >> $GITHUB_STEP_SUMMARY
          echo "**Source:** Google News RSS (日本語)" >> $GITHUB_STEP_SUMMARY
          echo "**Topics:** security, vendor, ai, cloud, network, enterprise" >> $GITHUB_STEP_SUMMARY