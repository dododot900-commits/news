name: Gemini News Workflow

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic (all / security / automotive / ai / cloud)'
        required: false
        default: 'all'

permissions:
  contents: write

jobs:
  process-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '24'

      - name: Fetch security news
        run: node scripts/fetch-news.js security 5
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}

      - name: Fetch automotive news
        run: node scripts/fetch-news.js automotive 5
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}

      - name: Fetch AI news
        run: node scripts/fetch-news.js ai 5
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}

      - name: Fetch cloud news
        run: node scripts/fetch-news.js cloud 5
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}

      - name: Process all topics with Gemini API
        run: node scripts/process-with-gemini.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/data/ output/ || true
          git commit -m "Update news - $(date +'%Y-%m-%d')" || echo "No changes"
          git push

      - name: Summary
        if: always()
        run: |
          echo "## Gemini News Workflow" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date +'%Y-%m-%d %H:%M JST')" >> $GITHUB_STEP_SUMMARY
          echo "**Topics:** security, automotive, ai, cloud" >> $GITHUB_STEP_SUMMARY
